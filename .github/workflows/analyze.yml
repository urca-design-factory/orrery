name: Analyze

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orrery/tokens build
      - run: pnpm typecheck
      - run: pnpm --filter @orrery/analyzer analyze

      - uses: actions/upload-artifact@v4
        with:
          name: orrery-index
          path: packages/analyzer/artifacts/index.json
