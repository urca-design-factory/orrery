name: Analyze

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @orrery/tokens build

      - run: pnpm typecheck

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: pnpm --filter @orrery/analyzer analyze

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'packages/analyzer/artifacts/analysis.md';
            if (!fs.existsSync(path)) return;

            const marker = '<!-- orrery-analyze -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orrery-index
          path: packages/analyzer/artifacts/index.json

      - name: Fail if the analyzer found blocking violations
        if: steps.analyze.outcome == 'failure'
        run: exit 1